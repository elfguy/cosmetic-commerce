<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>아쿠아 로션 상세이미지 V6 전체 보기</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #eef4f2;
        color: #17352f;
        font-family:
          Apple SD Gothic Neo,
          Noto Sans KR,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 22px;
        border-bottom: 1px solid #d7e5df;
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(10px);
      }

      h1 {
        margin: 0;
        font-size: 18px;
        letter-spacing: 0;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      a {
        color: #1479b8;
        font-weight: 800;
        text-decoration: none;
      }

      .button {
        display: inline-flex;
        align-items: center;
        min-height: 32px;
        padding: 0 12px;
        border: 1px solid #cddfd9;
        border-radius: 999px;
        background: #fff;
        font-size: 13px;
      }

      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 24px;
        max-width: 1180px;
        margin: 0 auto;
        padding: 28px 20px 60px;
      }

      .stage {
        display: flex;
        justify-content: center;
      }

      .full {
        width: min(780px, 100%);
        height: auto;
        border: 1px solid #d7e5df;
        background: #fff;
        box-shadow: 0 18px 48px rgba(23, 53, 47, 0.12);
      }

      aside {
        position: sticky;
        top: 76px;
        align-self: start;
        padding: 18px;
        border: 1px solid #d7e5df;
        border-radius: 16px;
        background: #fff;
      }

      aside h2 {
        margin: 0 0 12px;
        font-size: 16px;
      }

      .sheet {
        width: 100%;
        border: 1px solid #d7e5df;
        border-radius: 12px;
      }

      .list {
        display: grid;
        gap: 8px;
        margin-top: 16px;
        font-size: 13px;
      }

      @media (max-width: 980px) {
        header {
          align-items: flex-start;
          flex-direction: column;
        }

        main {
          display: block;
        }

        aside {
          position: static;
          margin-top: 24px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>아쿠아 로션 상세이미지 V6 전체 보기</h1>
      <nav>
        <a class="button" href="./detail-v6-full-stack.jpg">전체 이미지</a>
        <a class="button" href="./preview/v6-contact-sheet.jpg">콘택트시트</a>
        <a class="button" href="./bundles/">쿠팡 업로드 번들</a>
        <a class="button" href="./cuts/">15개 컷</a>
      </nav>
    </header>
    <main>
      <section class="stage">
        <img class="full" src="./detail-v6-full-stack.jpg" alt="아쿠아 로션 상세이미지 V6 전체 세로 이미지" />
      </section>
      <aside>
        <h2>전체 구성</h2>
        <img class="sheet" src="./preview/v6-contact-sheet.jpg" alt="V6 전체 콘택트시트" />
        <div class="list">
          <a href="./bundles/detail-v6-01-hook.jpg">01. 후킹/추천/근거</a>
          <a href="./bundles/detail-v6-02-ingredients-a.jpg">02. 성분 근거 A</a>
          <a href="./bundles/detail-v6-03-ingredients-trust.jpg">03. 성분/신뢰 근거</a>
          <a href="./bundles/detail-v6-04-ph-fresh-use.jpg">04. pH/제조/사용법</a>
          <a href="./bundles/detail-v6-05-brand-notice.jpg">05. 브랜드/고시/유통 안내</a>
        </div>
      </aside>
    </main>
  </body>
</html>
